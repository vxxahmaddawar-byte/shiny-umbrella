<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaser's Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden; background:#000;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
canvas { display:block; position:absolute; top:0; left:0; }
#title {
  position:absolute; top:16px; left:0; width:100%; text-align:center;
  font-family:"Orbitron","Segoe UI",system-ui,sans-serif;
  font-size:clamp(36px,7vw,72px); font-weight:800; letter-spacing:0.12em;
  color:#fff; z-index:10; pointer-events:none;
  text-shadow: 0 0 2px #fff, 0 0 8px rgba(255,255,255,0.55), 0 2px 12px rgba(0,0,0,0.65);
}
#games {
  position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
  display:flex; flex-wrap:wrap; align-content:flex-start; justify-content:center;
  gap:14px; padding:110px 18px 40px; z-index:5;
}
body.playing #games,
body.playing #title,
body.playing canvas { visibility:hidden; pointer-events:none; }
.game-btn {
  position:relative; width:110px; height:110px; border:none; cursor:pointer;
  background:rgba(255,255,255,0.08); color:#fff; font-size:10px; font-weight:600;
  letter-spacing:0.02em; display:flex; flex-direction:column; align-items:center;
  justify-content:flex-end; text-align:center; padding:0; border-radius:28%;
  overflow:hidden; transition:transform 0.15s, box-shadow 0.2s;
  box-shadow:0 0 0 1px rgba(255,255,255,0.22);
}
.game-btn img {
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:28%;
}
.game-btn span {
  position:relative; z-index:2; width:100%; padding:6px 6px 8px;
  background:linear-gradient(transparent, rgba(0,0,0,0.82));
  font-size:10px; line-height:1.2; word-break:break-word;
}
.game-btn:hover {
  transform:scale(1.07);
  box-shadow:0 0 0 1px rgba(255,255,255,0.5), 0 0 18px rgba(0,170,255,0.45);
}
.game-btn:active { transform:scale(0.96); }
#player {
  position:fixed; inset:0; z-index:100; background:#000; display:none;
}
#player.active { display:block; }
#player iframe {
  width:100%; height:100%; border:none; display:block; background:#000;
}
#back {
  position:fixed; top:14px; right:14px; z-index:110; width:46px; height:46px;
  border:none; border-radius:50%; background:rgba(0,0,0,0.72); color:#fff;
  font-size:22px; line-height:1; cursor:pointer; display:none;
  align-items:center; justify-content:center;
  box-shadow:0 0 0 1px rgba(255,255,255,0.3), 0 0 14px rgba(0,170,255,0.4);
  transition:background 0.15s, transform 0.15s;
}
#back.show { display:flex; }
#back:hover { background:rgba(0,50,100,0.9); transform:scale(1.08); }
</style>

<div id="player">
  <iframe id="gameframe" allow="fullscreen; gamepad; autoplay; clipboard-write" allowfullscreen></iframe>
</div>
<button id="back" type="button" aria-label="Back">←</button>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const player = document.getElementById("player");
const frameEl = document.getElementById("gameframe");
const back = document.getElementById("back");

let w, h, running = true, rafId = 0;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const particles = [];
for (let i = 0; i < 180; i++) {
  particles.push({
    x: Math.random() * w, y: Math.random() * h,
    r: Math.random() * 1.4 + 0.3,
    vx: (Math.random() - 0.5) * 0.35,
    vy: (Math.random() - 0.5) * 0.35,
    a: Math.random() * 0.6 + 0.25
  });
}
const squircles = [];
for (let i = 0; i < 400; i++) {
  const size = Math.random() * 7 + 3;
  squircles.push({
    x: Math.random() * w, y: Math.random() * h, size,
    vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
    rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 0.015,
    a: Math.random() * 0.5 + 0.2
  });
}

function drawSquircle(x, y, size, rot, a) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.beginPath();
  const n = 4, r = size / 2;
  for (let i = 0; i <= 64; i++) {
    const t = (i / 64) * Math.PI * 2;
    const cos = Math.cos(t), sin = Math.sin(t);
    const px = Math.sign(cos) * Math.pow(Math.abs(cos), 2 / n) * r;
    const py = Math.sign(sin) * Math.pow(Math.abs(sin), 2 / n) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  ctx.fill();
  ctx.restore();
}

function frameLoop() {
  if (!running) return;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, w, h);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
    if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${p.a})`;
    ctx.fill();
  }
  for (const s of squircles) {
    s.x += s.vx; s.y += s.vy; s.rot += s.vr;
    if (s.x < -20) s.x = w + 20; if (s.x > w + 20) s.x = -20;
    if (s.y < -20) s.y = h + 20; if (s.y > h + 20) s.y = -20;
    drawSquircle(s.x, s.y, s.size, s.rot, s.a);
  }
  rafId = requestAnimationFrame(frameLoop);
}
frameLoop();

async function openGame(src) {
  if (!src) return;
  try {
    const res = await fetch(src, { cache: "force-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const html = await res.text();
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    window.open(url, "_blank");
  } catch (e) {
    window.open(src, "_blank");
  }
}

function closeGame() {
  player.classList.remove("active");
  back.classList.remove("show");
  document.body.classList.remove("playing");
  const old = frameEl.src;
  frameEl.src = "about:blank";
  if (old && old.startsWith("blob:")) URL.revokeObjectURL(old);
  if (!running) { running = true; frameLoop(); }
}

document.querySelectorAll(".game-btn").forEach(btn => {
  btn.addEventListener("click", () => openGame(btn.getAttribute("data-src")));
});
back.addEventListener("click", closeGame);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && player.classList.contains("active")) closeGame();
});
</script>
